<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>床の2点から垂直面を配置</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #111827;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
    }

    #ar-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .panel {
      position: fixed;
      z-index: 1;
      inset: auto 12px max(12px, env(safe-area-inset-bottom));
      max-width: 520px;
      max-height: min(80vh, 700px);
      overflow-y: auto;
      overscroll-behavior: contain;
      margin: 0 auto;
      padding: 16px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 16px;
      background: rgb(17 24 39 / 92%);
      box-shadow: 0 12px 40px rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    p {
      margin: 8px 0 12px;
      color: #d1d5db;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    #status {
      min-height: 1.5em;
      color: #bfdbfe;
    }

    .point-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #point-buttons[hidden] {
      display: none;
    }

    #toggle-fine-adjustment[hidden] {
      display: none;
    }

    #fine-adjustment[hidden] {
      display: none;
    }

    .fine-adjustment {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgb(255 255 255 / 15%);
    }

    .fine-adjustment p {
      margin: 0 0 8px;
      font-size: 0.82rem;
    }

    .axis-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .axis-control label {
      display: block;
      margin-bottom: 4px;
      color: #d1d5db;
      font-size: 0.8rem;
    }

    .axis-control input {
      width: 100%;
      min-height: 38px;
      padding: 5px 7px;
      border: 1px solid #6b7280;
      border-radius: 8px;
      background: #1f2937;
      color: #fff;
      font: inherit;
    }

    .step-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 4px;
    }

    .step-buttons button,
    #reset-offset {
      min-height: 34px;
      padding: 4px;
      font-size: 0.85rem;
    }

    #depth-status {
      margin: 0 0 8px;
      color: #a7f3d0;
      font-size: 0.82rem;
    }

    #reset-offset {
      width: 100%;
      margin-top: 8px;
    }

    button {
      min-height: 46px;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary,
    button.is-selected {
      border: 1px solid #6b7280;
      background: #374151;
    }

    button.is-selected {
      border-color: #22d3ee;
      background: #155e75;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 380px) {
      .panel {
        padding: 12px;
      }

      p {
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>
  <main id="overlay" class="panel">
    <h1>床の2点から垂直面を配置</h1>
    <p id="status" role="status" aria-live="polite">対応状況を確認しています…</p>
    <p id="depth-status" role="status" aria-live="polite">深度遮蔽: 停止中（このページでは深度データ未取得）</p>
    <p id="instructions">ARを開始し、床の2点を指定してください。2点を結ぶ床の線と、その線分から鉛直上向きに1mの四角形を表示します。上辺はピンク、床側の下辺は黄色です。点を選んで「点の微調整を表示」を押すと、X/Y/Zで調整できます。</p>
    <button id="start-ar" type="button" disabled>ARを開始</button>
    <div id="point-buttons" class="point-buttons" hidden>
      <button type="button" data-point="0" disabled>1</button>
      <button type="button" data-point="1" disabled>2</button>
      <button id="clear-points" class="secondary" type="button" disabled>3: すべて解除</button>
    </div>
    <button id="toggle-fine-adjustment" class="secondary" type="button" aria-controls="fine-adjustment" aria-expanded="false" hidden>点の微調整を表示</button>
    <section id="fine-adjustment" class="fine-adjustment" hidden aria-label="選択点の微調整">
      <p>選択点のタップ位置からの移動量（cm）。X/Zは面に沿う方向、Yは面の法線方向です。±ボタンは1mm刻み。</p>
      <div class="axis-controls">
        <div class="axis-control">
          <label for="offset-x">X (cm)</label>
          <input id="offset-x" type="number" step="0.1" value="0">
          <div class="step-buttons">
            <button type="button" data-axis="x" data-step="-0.1" aria-label="Xを1ミリメートル減らす">−</button>
            <button type="button" data-axis="x" data-step="0.1" aria-label="Xを1ミリメートル増やす">+</button>
          </div>
        </div>
        <div class="axis-control">
          <label for="offset-y">Y (cm)</label>
          <input id="offset-y" type="number" step="0.1" value="0">
          <div class="step-buttons">
            <button type="button" data-axis="y" data-step="-0.1" aria-label="Yを1ミリメートル減らす">−</button>
            <button type="button" data-axis="y" data-step="0.1" aria-label="Yを1ミリメートル増やす">+</button>
          </div>
        </div>
        <div class="axis-control">
          <label for="offset-z">Z (cm)</label>
          <input id="offset-z" type="number" step="0.1" value="0">
          <div class="step-buttons">
            <button type="button" data-axis="z" data-step="-0.1" aria-label="Zを1ミリメートル減らす">−</button>
            <button type="button" data-axis="z" data-step="0.1" aria-label="Zを1ミリメートル増やす">+</button>
          </div>
        </div>
      </div>
      <button id="reset-offset" class="secondary" type="button">タップ位置に戻す</button>
    </section>
  </main>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

    const overlay = document.querySelector("#overlay");
    const status = document.querySelector("#status");
    const depthStatus = document.querySelector("#depth-status");
    const instructions = document.querySelector("#instructions");
    const startButton = document.querySelector("#start-ar");
    const pointButtons = [...document.querySelectorAll("[data-point]")];
    const clearButton = document.querySelector("#clear-points");
    const pointControls = document.querySelector("#point-buttons");
    const fineAdjustmentToggle = document.querySelector("#toggle-fine-adjustment");
    const fineAdjustment = document.querySelector("#fine-adjustment");
    const offsetInputs = {
      x: document.querySelector("#offset-x"),
      y: document.querySelector("#offset-y"),
      z: document.querySelector("#offset-z")
    };
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera();
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local");
    renderer.setClearColor(0x000000, 0);
    renderer.domElement.id = "ar-canvas";
    document.body.prepend(renderer.domElement);

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.045, 0.06, 32),
      new THREE.MeshBasicMaterial({ color: 0x22d3ee, side: THREE.DoubleSide })
    );
    reticle.geometry.rotateX(-Math.PI / 2);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const pointMaterials = [0xf87171, 0x4ade80]
      .map((color) => new THREE.MeshBasicMaterial({ color }));
    const pointGeometry = new THREE.SphereGeometry(0.014, 16, 12);
    const points = Array(2).fill(null);
    const pointBases = Array(2).fill(null);
    const pointMeshes = pointMaterials.map((material) => {
      const mesh = new THREE.Mesh(pointGeometry, material);
      mesh.visible = false;
      scene.add(mesh);
      return mesh;
    });
    const planeGeometry = new THREE.BufferGeometry();
    planeGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(12), 3));
    planeGeometry.setIndex([0, 1, 2, 0, 2, 3]);
    const planeMesh = new THREE.Mesh(
      planeGeometry,
      new THREE.MeshBasicMaterial({
        color: 0x22d3ee,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.35,
        depthWrite: false
      })
    );
    planeMesh.visible = false;
    planeMesh.renderOrder = 1;
    scene.add(planeMesh);
    const horizontalEdgeGeometry = new THREE.CylinderGeometry(0.0025, 0.0025, 1, 12);
    function createHorizontalEdge(color, renderOrder) {
      const edge = new THREE.Mesh(
        horizontalEdgeGeometry,
        new THREE.MeshBasicMaterial({ color })
      );
      edge.visible = false;
      edge.renderOrder = renderOrder;
      scene.add(edge);
      return edge;
    }
    const lowerEdge = createHorizontalEdge(0xfacc15, 3);
    const upperEdge = createHorizontalEdge(0xf472b6, 4);
    const verticalEdgesGeometry = new THREE.BufferGeometry();
    verticalEdgesGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(12), 3));
    const verticalEdges = new THREE.LineSegments(
      verticalEdgesGeometry,
      new THREE.LineBasicMaterial({ color: 0x22d3ee })
    );
    verticalEdges.visible = false;
    verticalEdges.renderOrder = 2;
    scene.add(verticalEdges);
    let session;
    let hitTestSource;
    let referenceSpace;
    let activePoint = null;
    let selectedPoint = null;
    let fineAdjustmentExpanded = false;

    function setFineAdjustmentExpanded(expanded) {
      const canAdjust = selectedPoint !== null && pointBases[selectedPoint] !== null;
      fineAdjustmentExpanded = canAdjust && expanded;
      fineAdjustmentToggle.hidden = !canAdjust;
      fineAdjustmentToggle.textContent = fineAdjustmentExpanded
        ? "点の微調整を隠す"
        : "点の微調整を表示";
      fineAdjustmentToggle.setAttribute("aria-expanded", String(fineAdjustmentExpanded));
      fineAdjustment.hidden = !fineAdjustmentExpanded;
    }

    function updateStatus() {
      if (activePoint !== null) {
        status.textContent = `点${activePoint + 1}の位置を照準リングで指定し、画面をタップしてください。`;
      } else if (points.every((point) => point !== null)) {
        status.textContent = "床の2点を結ぶ線と、鉛直上向き1mの四角形を配置しました。点1・2で位置を調整できます。";
      } else {
        const placed = points.filter((point) => point !== null).length;
        status.textContent = `配置済み: ${placed}/2点。1または2を選び、床の位置をタップしてください。`;
      }
    }

    function positionThickEdge(edge, start, end) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      edge.position.copy(start).add(end).multiplyScalar(0.5);
      edge.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      edge.scale.y = length;
    }

    function updatePlane() {
      const verticalOffset = new THREE.Vector3(0, 1, 0);
      const first = points[0] || new THREE.Vector3();
      const second = points[1] || new THREE.Vector3();
      const positionedPoints = [
        first,
        second,
        second.clone().add(verticalOffset),
        first.clone().add(verticalOffset)
      ];
      const positionAttribute = planeGeometry.getAttribute("position");
      const verticalEdgesPositionAttribute = verticalEdgesGeometry.getAttribute("position");
      positionedPoints.forEach((point, index) => {
        positionAttribute.setXYZ(index, point.x, point.y, point.z);
      });
      verticalEdgesPositionAttribute.setXYZ(0, first.x, first.y, first.z);
      verticalEdgesPositionAttribute.setXYZ(1, positionedPoints[3].x, positionedPoints[3].y, positionedPoints[3].z);
      verticalEdgesPositionAttribute.setXYZ(2, second.x, second.y, second.z);
      verticalEdgesPositionAttribute.setXYZ(3, positionedPoints[2].x, positionedPoints[2].y, positionedPoints[2].z);
      positionAttribute.needsUpdate = true;
      verticalEdgesPositionAttribute.needsUpdate = true;
      planeGeometry.computeVertexNormals();
      planeGeometry.computeBoundingSphere();
      verticalEdgesGeometry.computeBoundingSphere();

      const complete = points.every((point) => point !== null);
      if (!complete) {
        planeMesh.visible = false;
        verticalEdges.visible = false;
        lowerEdge.visible = false;
        upperEdge.visible = false;
        return;
      }

      const hasLength = points[0].distanceToSquared(points[1]) > 0.000001;
      if (hasLength) {
        positionThickEdge(lowerEdge, first, second);
        positionThickEdge(upperEdge, positionedPoints[3], positionedPoints[2]);
      }
      planeMesh.visible = hasLength;
      verticalEdges.visible = hasLength;
      lowerEdge.visible = hasLength;
      upperEdge.visible = hasLength;
    }

    function selectPoint(index) {
      if (!session) {
        status.textContent = "先にARを開始してください。";
        return;
      }
      activePoint = index;
      selectedPoint = index;
      pointButtons.forEach((button, buttonIndex) => {
        const placed = points[buttonIndex] !== null;
        button.textContent = placed ? `${buttonIndex + 1} ✓` : `${buttonIndex + 1}`;
        button.classList.toggle("is-selected", buttonIndex === index);
        button.setAttribute("aria-pressed", String(buttonIndex === index));
      });
      const base = pointBases[index];
      if (base) {
        offsetInputs.x.value = base.offset.x.toFixed(1);
        offsetInputs.y.value = base.offset.y.toFixed(1);
        offsetInputs.z.value = base.offset.z.toFixed(1);
      }
      setFineAdjustmentExpanded(base !== null && fineAdjustmentExpanded);
      updateStatus();
    }

    function applyOffset() {
      if (selectedPoint === null || pointBases[selectedPoint] === null) {
        return;
      }
      const values = Object.values(offsetInputs).map((input) => Number(input.value));
      if (Object.values(offsetInputs).some((input) => input.value.trim() === "") ||
          values.some((value) => !Number.isFinite(value))) {
        status.textContent = "移動量は有効な数値で入力してください。";
        return;
      }

      const [x, y, z] = values;
      const base = pointBases[selectedPoint];
      base.offset.set(x, y, z);
      const displacement = new THREE.Vector3(x / 100, y / 100, z / 100)
        .applyQuaternion(base.orientation);
      points[selectedPoint].copy(base.position).add(displacement);
      pointMeshes[selectedPoint].position.copy(points[selectedPoint]);
      updatePlane();
      status.textContent = `点${selectedPoint + 1}を X ${x} / Y ${y} / Z ${z} cm に調整しました。`;
    }

    function stepOffset(axis, amount) {
      const input = offsetInputs[axis];
      const current = Number(input.value);
      const next = (Number.isFinite(current) ? current : 0) + amount;
      input.value = next.toFixed(1);
      applyOffset();
    }

    function onSelect(event) {
      if (activePoint === null) {
        status.textContent = "点1または2のボタンを選んでから、床の配置位置をタップしてください。";
        return;
      }
      const results = event.frame.getHitTestResults(hitTestSource);
      if (!results.length) {
        status.textContent = "面を検出できません。照準リングを床や机などに合わせてください。";
        return;
      }
      const pose = results[0].getPose(referenceSpace);
      if (!pose) {
        status.textContent = "タップ位置を取得できませんでした。もう一度お試しください。";
        return;
      }
      const index = activePoint;
      const position = new THREE.Vector3(
        pose.transform.position.x,
        pose.transform.position.y,
        pose.transform.position.z
      );
      const orientation = new THREE.Quaternion(
        pose.transform.orientation.x,
        pose.transform.orientation.y,
        pose.transform.orientation.z,
        pose.transform.orientation.w
      );
      pointBases[index] = {
        position,
        orientation,
        offset: new THREE.Vector3()
      };
      points[index] = position.clone();
      pointMeshes[index].position.copy(position);
      pointMeshes[index].visible = true;
      activePoint = null;
      pointButtons[index].textContent = `${index + 1} ✓`;
      setFineAdjustmentExpanded(false);
      offsetInputs.x.value = "0";
      offsetInputs.y.value = "0";
      offsetInputs.z.value = "0";
      updatePlane();
      updateStatus();
    }

    renderer.setAnimationLoop((time, frame) => {
      if (frame && hitTestSource && referenceSpace) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length) {
          const pose = results[0].getPose(referenceSpace);
          if (pose) {
            reticle.matrix.fromArray(pose.transform.matrix);
            reticle.visible = true;
          }
        } else {
          reticle.visible = false;
        }
      }
      renderer.render(scene, camera);
    });

    startButton.addEventListener("click", async () => {
      if (!navigator.xr) {
        status.textContent = "このブラウザーはWebXRに対応していません。ARCore対応のAndroid端末でChromeを使ってください。";
        return;
      }

      startButton.disabled = true;
      status.textContent = "ARセッションを開始しています…";
      try {
        session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["hit-test", "dom-overlay"],
          optionalFeatures: ["local-floor"],
          domOverlay: { root: overlay }
        });
        await renderer.xr.setSession(session);
        referenceSpace = renderer.xr.getReferenceSpace();
        if (!referenceSpace) {
          throw new Error("AR reference space is unavailable");
        }
        const hitTestSpace = await session.requestReferenceSpace("viewer");
        hitTestSource = await session.requestHitTestSource({ space: hitTestSpace });
        session.addEventListener("select", onSelect);
        session.addEventListener("end", () => {
          hitTestSource = undefined;
          referenceSpace = undefined;
          reticle.visible = false;
          depthStatus.textContent = "深度遮蔽: 無効（通常ARモード）";
          clearButton.disabled = true;
          pointButtons.forEach((button) => {
            button.disabled = true;
            button.classList.remove("is-selected");
            button.setAttribute("aria-pressed", "false");
          });
          pointControls.hidden = true;
          setFineAdjustmentExpanded(false);
          instructions.textContent = "ARを開始し、床の2点を指定してください。2点を結ぶ床の線と、その線分から鉛直上向きに1mの四角形を表示します。上辺はピンク、床側の下辺は黄色です。点を選んで「点の微調整を表示」を押すと、X/Y/Zで調整できます。";
          startButton.disabled = false;
          startButton.hidden = false;
          activePoint = null;
          clearPoints();
          status.textContent = "ARセッションが終了しました。もう一度開始できます。";
        }, { once: true });
        startButton.hidden = true;
        instructions.textContent = "床の2点を指定してください。点1または2を選んで床をタップし、配置済みの点を選び直すと置き直しできます。高さ1mの四角形は自動で更新されます。";
        pointControls.hidden = false;
        pointButtons.forEach((button) => {
          button.disabled = false;
        });
        clearButton.disabled = false;
        depthStatus.textContent = "深度遮蔽: 無効（通常ARモード）";
        status.textContent = "まず点1または2のボタンを選んでください。";
      } catch (error) {
        const failedSession = session;
        session = undefined;
        let cleanupFailure = "";
        if (failedSession) {
          try {
            await failedSession.end();
          } catch (endError) {
            cleanupFailure = ` セッション終了時のエラー: ${endError.message || endError.name}`;
          }
        }
        startButton.disabled = false;
        const reason = error && error.message ? ` (${error.message})` : "";
        depthStatus.textContent = "深度遮蔽: 無効（通常ARモード）";
        status.textContent = `ARを開始できませんでした。ARCore対応端末・Chrome・HTTPS接続を確認してください${reason}${cleanupFailure}`;
      }
    });

    pointButtons.forEach((button, index) => {
      button.addEventListener("click", () => selectPoint(index));
    });

    fineAdjustmentToggle.addEventListener("click", () => {
      setFineAdjustmentExpanded(!fineAdjustmentExpanded);
    });

    Object.values(offsetInputs).forEach((input) => {
      input.addEventListener("input", applyOffset);
    });

    document.querySelectorAll("[data-axis][data-step]").forEach((button) => {
      button.addEventListener("click", () => {
        stepOffset(button.dataset.axis, Number(button.dataset.step));
      });
    });

    document.querySelector("#reset-offset").addEventListener("click", () => {
      if (selectedPoint === null || pointBases[selectedPoint] === null) {
        return;
      }
      offsetInputs.x.value = "0";
      offsetInputs.y.value = "0";
      offsetInputs.z.value = "0";
      applyOffset();
    });

    function clearPoints() {
      points.fill(null);
      pointMeshes.forEach((mesh) => {
        mesh.visible = false;
      });
      pointButtons.forEach((button, index) => {
        button.textContent = `${index + 1}`;
        button.classList.remove("is-selected");
        button.setAttribute("aria-pressed", "false");
      });
      pointBases.fill(null);
      activePoint = null;
      selectedPoint = null;
      setFineAdjustmentExpanded(false);
      planeMesh.visible = false;
      verticalEdges.visible = false;
      lowerEdge.visible = false;
      upperEdge.visible = false;
      updateStatus();
    }

    clearButton.addEventListener("click", clearPoints);

    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener("pagehide", () => {
      if (session) {
        session.end();
      }
      renderer.dispose();
      pointGeometry.dispose();
      pointMaterials.forEach((material) => material.dispose());
      planeGeometry.dispose();
      planeMesh.material.dispose();
      horizontalEdgeGeometry.dispose();
      lowerEdge.material.dispose();
      upperEdge.material.dispose();
      verticalEdgesGeometry.dispose();
      verticalEdges.material.dispose();
      reticle.geometry.dispose();
      reticle.material.dispose();
    });

    if (!window.isSecureContext) {
      status.textContent = "カメラARにはHTTPS接続が必要です。PCで試す場合はlocalhostのLive Serverを使ってください。";
    } else if (!navigator.xr) {
      status.textContent = "この環境ではWebXRが使えません。対応するAndroid端末のChromeからアクセスしてください。";
    } else {
      try {
        const supported = await navigator.xr.isSessionSupported("immersive-ar");
        status.textContent = supported
          ? "ARを開始できます。Android端末で「ARを開始」を押してください。"
          : "この端末／ブラウザーは空間ARに対応していません。ARCore対応Android端末のChromeをお使いください。";
        startButton.disabled = !supported;
      } catch (error) {
        status.textContent = `AR対応状況を確認できませんでした: ${error.message || error.name}`;
        startButton.disabled = true;
      }
    }
  </script>
</body>
</html>
